name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.12"]
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install
        run: pip install -e ".[dev]"

      - name: Run tests
        run: pytest -q

      - name: Setup check on fixture
        run: |
          python instagram_analysis.py --check \
            --export-dir tests/fixtures/minimal_export/instagram-demo-2026-01-01-TEST01

      - name: Verify example output matches fixture
        run: |
          python instagram_analysis.py \
            --export-dir tests/fixtures/minimal_export/instagram-demo-2026-01-01-TEST01 \
            --section all | python sanitize.py - \
            --export-dir tests/fixtures/minimal_export/instagram-demo-2026-01-01-TEST01 \
            -o output.example.txt
          git diff --exit-code output.example.txt
