<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="760" viewBox="0 0 1200 760" role="img" aria-labelledby="title desc">
  <title id="title">Watchr Connections Output Map</title>
  <desc id="desc">Minimal shape-based map showing followers, following, mutuals, and cleaned output buckets with run-to-run deltas.</desc>
  <rect x="0" y="0" width="1200" height="760" fill="#ffffff"/>

  <!-- frame -->
  <rect x="40" y="40" width="1120" height="680" rx="12" fill="none" stroke="#e7e9ec" stroke-width="1"/>
  <text x="80" y="96" font-family="Inter, Geist, system-ui, -apple-system, sans-serif" font-size="34" font-weight="500" fill="#171a1f" letter-spacing="-0.4">Watchr Output Map</text>
  <text x="80" y="126" font-family="Inter, Geist, system-ui, -apple-system, sans-serif" font-size="16" font-weight="400" fill="#5e636e">What users see in the connections report</text>

  <!-- venn -->
  <text x="80" y="182" font-family="Inter, Geist, system-ui, -apple-system, sans-serif" font-size="15" fill="#5e636e">Core sets</text>
  <circle cx="332" cy="318" r="170" fill="none" stroke="#2b5cff" stroke-width="2"/>
  <circle cx="510" cy="318" r="170" fill="none" stroke="#cfd3da" stroke-width="2"/>

  <text x="232" y="232" font-family="Inter, Geist, system-ui, -apple-system, sans-serif" font-size="20" font-weight="500" fill="#171a1f">FOLLOWERS</text>
  <text x="485" y="232" font-family="Inter, Geist, system-ui, -apple-system, sans-serif" font-size="20" font-weight="500" fill="#171a1f">FOLLOWING</text>
  <text x="377" y="326" font-family="Inter, Geist, system-ui, -apple-system, sans-serif" font-size="22" font-weight="500" fill="#171a1f">MUTUALS</text>

  <text x="212" y="368" font-family="Inter, Geist, system-ui, -apple-system, sans-serif" font-size="14" fill="#5e636e">you don't follow back</text>
  <text x="520" y="368" font-family="Inter, Geist, system-ui, -apple-system, sans-serif" font-size="14" fill="#5e636e">raw not-following-back claim</text>

  <!-- since last run -->
  <rect x="730" y="176" width="380" height="170" rx="10" fill="#ffffff" stroke="#e7e9ec" stroke-width="1"/>
  <text x="760" y="214" font-family="Inter, Geist, system-ui, -apple-system, sans-serif" font-size="16" font-weight="500" fill="#171a1f">Since last run</text>
  <line x1="760" y1="228" x2="1080" y2="228" stroke="#e7e9ec" stroke-width="1"/>
  <text x="760" y="266" font-family="Inter, Geist, system-ui, -apple-system, sans-serif" font-size="14" fill="#2b5cff">+ Followed you</text>
  <text x="760" y="302" font-family="Inter, Geist, system-ui, -apple-system, sans-serif" font-size="14" fill="#5e636e">- Unfollowed you</text>
  <text x="760" y="330" font-family="Inter, Geist, system-ui, -apple-system, sans-serif" font-size="12" fill="#5e636e">computed from per-export follower snapshot</text>

  <!-- cleaning pipeline -->
  <text x="80" y="530" font-family="Inter, Geist, system-ui, -apple-system, sans-serif" font-size="15" fill="#5e636e">Cleaning pipeline</text>

  <rect x="80" y="558" width="190" height="76" rx="8" fill="#ffffff" stroke="#e7e9ec" stroke-width="1"/>
  <text x="98" y="589" font-family="Inter, Geist, system-ui, -apple-system, sans-serif" font-size="14" font-weight="500" fill="#171a1f">Raw claim</text>
  <text x="98" y="612" font-family="Inter, Geist, system-ui, -apple-system, sans-serif" font-size="12" fill="#5e636e">following - followers</text>

  <rect x="318" y="558" width="190" height="76" rx="8" fill="#ffffff" stroke="#e7e9ec" stroke-width="1"/>
  <text x="336" y="589" font-family="Inter, Geist, system-ui, -apple-system, sans-serif" font-size="14" font-weight="500" fill="#171a1f">Subtract signals</text>
  <text x="336" y="612" font-family="Inter, Geist, system-ui, -apple-system, sans-serif" font-size="12" fill="#5e636e">pending, restricted, unfollowed</text>

  <rect x="556" y="558" width="190" height="76" rx="8" fill="#ffffff" stroke="#e7e9ec" stroke-width="1"/>
  <text x="574" y="589" font-family="Inter, Geist, system-ui, -apple-system, sans-serif" font-size="14" font-weight="500" fill="#171a1f">Apply curation</text>
  <text x="574" y="612" font-family="Inter, Geist, system-ui, -apple-system, sans-serif" font-size="12" fill="#5e636e">confirmed and denied</text>

  <rect x="794" y="558" width="316" height="76" rx="8" fill="#ffffff" stroke="#2b5cff" stroke-width="1.5"/>
  <text x="812" y="589" font-family="Inter, Geist, system-ui, -apple-system, sans-serif" font-size="14" font-weight="500" fill="#171a1f">Output buckets</text>
  <text x="812" y="612" font-family="Inter, Geist, system-ui, -apple-system, sans-serif" font-size="12" fill="#5e636e">ghost list, mutuals (incl. promoted), derived counts</text>

  <line x1="270" y1="596" x2="318" y2="596" stroke="#cfd3da" stroke-width="1"/>
  <polygon points="312,592 318,596 312,600" fill="#cfd3da"/>
  <line x1="508" y1="596" x2="556" y2="596" stroke="#cfd3da" stroke-width="1"/>
  <polygon points="550,592 556,596 550,600" fill="#cfd3da"/>
  <line x1="746" y1="596" x2="794" y2="596" stroke="#2b5cff" stroke-width="1.5"/>
  <polygon points="788,591 794,596 788,601" fill="#2b5cff"/>
</svg>
