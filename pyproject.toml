[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "watchr"
version = "0.1.0"
description = "Offline unofficial watcher for Instagram data exports"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Watchr contributors" }]
keywords = ["instagram", "privacy", "gdpr", "data-export"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: End Users/Desktop",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Utilities",
]
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=7.0"]

[project.scripts]
watchr = "instagram_analysis:main"

[tool.setuptools]
py-modules = [
    "instagram_analysis",
    "sanitize",
    "export_paths",
    "export_inventory",
    "setup_check",
    "context",
    "curate_session",
]

[tool.setuptools.packages.find]
include = [
    "connections*",
    "ads*",
    "activity*",
    "security*",
    "messages*",
    "apps*",
    "contacts*",
    "shopping*",
    "preferences*",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
